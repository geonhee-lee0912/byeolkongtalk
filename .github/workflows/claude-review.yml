# Codex 가 만든 PR 을 Claude 가 자동 리뷰한다 — 리뷰는 반대편이 한다(회사 운영 모델).
# Claude 가 만든 PR(브랜치 claude/…)은 Codex 가 리뷰하므로 여기서 건너뛴다.
# 인증 = 운영자 Max 구독 토큰(저장소 Actions 비밀값 CLAUDE_CODE_OAUTH_TOKEN). API 과금 아님.
# 공개 저장소라 Actions 시간은 무료. 포크 PR 에는 비밀값이 안 실려 돌지 않는다.
# 새 커밋마다가 아니라 열릴 때만 돈다(사용량 절약). 다시 보게 하려면 PR 을 닫았다 다시 연다.
name: claude-review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    if: ${{ !startsWith(github.head_ref, 'claude/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
